<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Lukinha Pneus | Catálogo</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #0d0d0d;
      color: #ffffff;
    }

    /* CABEÇALHO */

    header {
      background: #000000;
      border-bottom: 3px solid #e30613;
      padding: 25px 20px 22px;
      text-align: center;
    }

    .logo {
      width: 100%;
      max-width: 480px;
      display: block;
      margin: 0 auto;
    }

    header p {
      margin-top: 12px;
      color: #bdbdbd;
      font-size: 15px;
    }

    /* CONTEÚDO */

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 30px 20px 50px;
    }

    .title-area {
      margin-bottom: 22px;
    }

    .title-area h1 {
      font-size: 28px;
      margin-bottom: 5px;
    }

    .title-area p {
      color: #999999;
      font-size: 14px;
    }

    /* BUSCA */

    .search-area {
      background: #171717;
      border: 1px solid #292929;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 22px;
    }

    .search-area input {
      width: 100%;
      padding: 15px 17px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #444444;
      outline: none;
      background: #ffffff;
      color: #111111;
    }

    /* FILTROS */

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 28px;
    }

    .filter-btn {
      border: 1px solid #444444;
      background: #1c1c1c;
      color: #ffffff;
      padding: 10px 17px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
    }

    .filter-btn:hover,
    .filter-btn.active {
      background: #e30613;
      border-color: #e30613;
    }

    /* PRODUTOS */

    .products {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 22px;
    }

    .card {
      background: #ffffff;
      color: #111111;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 8px 25px rgba(0, 0, 0, .35);
      transition: transform .2s ease;
    }

    .card:hover {
      transform: translateY(-3px);
    }

    .image-box {
      width: 100%;
      height: 310px;
      overflow: hidden;
      background: #222222;
    }

    .image-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card-content {
      padding: 20px;
    }

    .tag {
      display: inline-block;
      background: #111111;
      color: #ffffff;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: bold;
      border-radius: 20px;
      margin-bottom: 12px;
    }

    .measure {
      font-size: 27px;
      font-weight: 900;
      margin-bottom: 7px;
    }

    .type {
      color: #666666;
      font-size: 15px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .price {
      color: #e30613;
      font-size: 29px;
      font-weight: 900;
      margin-bottom: 18px;
    }

    .price.consultar {
      font-size: 22px;
    }

    .price small {
      font-size: 13px;
      color: #666666;
      font-weight: normal;
    }

    .whatsapp {
      display: block;
      width: 100%;
      text-align: center;
      text-decoration: none;
      background: #25d366;
      color: #ffffff;
      padding: 14px;
      border-radius: 8px;
      font-weight: 800;
    }

    .whatsapp:hover {
      filter: brightness(.92);
    }

    .empty {
      display: none;
      text-align: center;
      padding: 50px 20px;
      color: #aaaaaa;
      grid-column: 1 / -1;
    }

    footer {
      text-align: center;
      color: #777777;
      padding: 30px 20px;
      border-top: 1px solid #222222;
    }

    /* CELULAR */

    @media (max-width: 700px) {
      header {
        padding: 20px 15px;
      }

      .logo {
        max-width: 330px;
      }

      .container {
        padding: 25px 14px 40px;
      }

      .products {
        grid-template-columns: 1fr;
      }

      .image-box {
        height: 300px;
      }

      .title-area h1 {
        font-size: 24px;
      }

      .measure {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>

<header>

  <img
    src="LOGO LUKINHA PNEUS.jpeg"
    alt="Lukinha Pneus"
    class="logo"
  >

  <p>Encontre o pneu ideal para o seu veículo</p>

</header>

<main class="container">

  <div class="title-area">
    <h1>Catálogo de Pneus</h1>
    <p>Consulte nossas medidas disponíveis</p>
  </div>


  <div class="search-area">

    <input
      type="text"
      id="search"
      placeholder="Digite uma medida, ex: 205/70 R15"
    >

  </div>


  <div class="filters">

    <button class="filter-btn active" data-filter="todos">
      Todos
    </button>

    <button class="filter-btn" data-filter="14">
      Aro 14
    </button>

    <button class="filter-btn" data-filter="15">
      Aro 15
    </button>

    <button class="filter-btn" data-filter="16">
      Aro 16
    </button>

  </div>


  <section class="products" id="products"></section>

  <div class="empty" id="empty">
    Nenhum pneu encontrado com essa medida.
  </div>

</main>


<footer>
  Lukinha Pneus • Catálogo Digital
</footer>


<script>

  /* =========================================
     CADASTRO DOS PNEUS

     É PRINCIPALMENTE AQUI QUE VAMOS MEXER
     DAQUI PRA FRENTE.
     ========================================= */

  const pneus = [

    {
      medida: "175/70 R14",
      tipo: "Recapado",
      preco: 150,
      aro: "14",
      imagem: "PNEU 1757014.jpeg"
    },

    {
      medida: "175/80 R14",
      tipo: "Recapado",
      preco: 180,
      aro: "14",
      imagem: "PNEU 1758014.jpeg"
    },

    {
      medida: "205/70 R15",
      tipo: "Recapado",
      preco: 350,
      aro: "15",
      imagem: "PNEU 2057015.jpeg"
    },

    {
      medida: "205/60 R15",
      tipo: "Recapado",
      preco: null,
      aro: "15",
      imagem: "PNEU 2056015.jpeg"
    },

    {
      medida: "205/60 R16",
      tipo: "Recapado",
      preco: 350,
      aro: "16",
      imagem: "PNEU 2056014.jpeg"
    }

  ];


  const numeroWhatsApp = "5543988163284";

  const productsContainer =
    document.getElementById("products");

  const search =
    document.getElementById("search");

  const empty =
    document.getElementById("empty");

  let filtroAro = "todos";


  function formatarPreco(valor) {

    if (valor === null) {
      return "Consulte o preço";
    }

    return valor.toLocaleString(
      "pt-BR",
      {
        style: "currency",
        currency: "BRL"
      }
    );

  }


  function normalizar(texto) {

    return texto
      .toLowerCase()
      .replace(/\s/g, "")
      .replace("r", "");

  }


  function montarProdutos() {

    const pesquisa =
      normalizar(search.value);

    const filtrados =
      pneus.filter(pneu => {

        const medida =
          normalizar(pneu.medida);

        const atendePesquisa =
          medida.includes(pesquisa);

        const atendeAro =
          filtroAro === "todos" ||
          pneu.aro === filtroAro;

        return atendePesquisa &&
               atendeAro;

      });


    productsContainer.innerHTML = "";


    filtrados.forEach(pneu => {

      const mensagem =
        `Olá, tenho interesse no pneu ${pneu.medida} ${pneu.tipo}.`;

      const whatsapp =
        `https://wa.me/${numeroWhatsApp}?text=${encodeURIComponent(mensagem)}`;


      const precoHTML =
        pneu.preco === null

        ? `
          <div class="price consultar">
            Consulte o preço
          </div>
        `

        : `
          <div class="price">
            ${formatarPreco(pneu.preco)}
            <small>/ unidade</small>
          </div>
        `;


      const card = `

        <article class="card">

          <div class="image-box">

            <img
              src="${pneu.imagem}"
              alt="Pneu ${pneu.medida}"
            >

          </div>

          <div class="card-content">

            <span class="tag">
              ARO ${pneu.aro}
            </span>

            <div class="measure">
              ${pneu.medida}
            </div>

            <div class="type">
              ${pneu.tipo}
            </div>

            ${precoHTML}

            <a
              class="whatsapp"
              href="${whatsapp}"
              target="_blank"
            >
              Pedir pelo WhatsApp
            </a>

          </div>

        </article>

      `;

      productsContainer.innerHTML += card;

    });


    empty.style.display =
      filtrados.length === 0
      ? "block"
      : "none";

  }


  search.addEventListener(
    "input",
    montarProdutos
  );


  document
    .querySelectorAll(".filter-btn")
    .forEach(botao => {

      botao.addEventListener(
        "click",
        () => {

          document
            .querySelectorAll(".filter-btn")
            .forEach(b =>
              b.classList.remove("active")
            );

          botao.classList.add("active");

          filtroAro =
            botao.dataset.filter;

          montarProdutos();

        }
      );

    });


  montarProdutos();

</script>

</body>
</html>
